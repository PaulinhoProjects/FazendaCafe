{% extends "base.html" %}

{% block titulo %}Novo Manejo do Mato{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/manejo-mato" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-success text-white py-3">
        <h3 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Registrar Manejo do Mato</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="talhao_id" class="form-label fw-semibold">
                        <i class="bi bi-pin-map-fill text-success me-1"></i>Talhão <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="talhao_id" name="talhao_id" required>
                        <option value="">Selecione</option>
                        {% for t in talhoes %}
                        <option value="{{ t.id }}">{{ t.nome }} ({{ "%.2f"|format(t.area) }} ha)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="data_manejo" class="form-label fw-semibold">
                        <i class="bi bi-calendar-check text-success me-1"></i>Data <span class="text-danger">*</span>
                    </label>
                    <input type="date" class="form-control" id="data_manejo" name="data_manejo" value="{{ data_atual }}" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="tipo_manejo" class="form-label fw-semibold">
                        <i class="bi bi-tag text-primary me-1"></i>Tipo de Manejo <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="tipo_manejo" name="tipo_manejo" 
                           placeholder="Ex: Capina manual, Herbicida, Roçada" required>
                </div>
                <div class="col-md-6">
                    <label for="responsavel" class="form-label fw-semibold">
                        <i class="bi bi-person-badge text-info me-1"></i>Responsável
                    </label>
                    <input type="text" class="form-control" id="responsavel" name="responsavel" placeholder="Nome do responsável">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="produtos" class="form-label fw-semibold">
                        <i class="bi bi-droplet text-warning me-1"></i>Produtos Utilizados
                    </label>
                    <input type="text" class="form-control" id="produtos" name="produtos" placeholder="Ex: Herbicida X, Adjuvante Y">
                </div>
                <div class="col-md-6">
                    <label for="dosagem" class="form-label fw-semibold">
                        <i class="bi bi-rulers text-secondary me-1"></i>Dosagem
                    </label>
                    <input type="text" class="form-control" id="dosagem" name="dosagem" placeholder="Ex: 2 L/ha">
                </div>
            </div>

            <div class="mb-3">
                <label for="observacoes" class="form-label fw-semibold">
                    <i class="bi bi-chat-text me-1"></i>Observações
                </label>
                <textarea class="form-control" id="observacoes" name="observacoes" rows="3"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-save me-1"></i>Salvar
                </button>
                <a href="/manejo-mato" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
