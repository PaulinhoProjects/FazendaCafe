{% extends "base.html" %}
{% block titulo %}Nova Nota Fiscal{% endblock %}
{% block conteudo %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle me-2"></i>Nova Nota Fiscal</h2>
        <a href="{{ url_for('notas_fiscais.dashboard') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('notas_fiscais.nova') }}" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-3 mb-3"><label class="form-label">Número *</label><input type="text" name="numero_nota" class="form-control" required></div>
                    <div class="col-md-3 mb-3"><label class="form-label">Série</label><input type="text" name="serie" class="form-control"></div>
                    <div class="col-md-3 mb-3"><label class="form-label">Data Emissão *</label><input type="date" name="data_emissao" class="form-control" required></div>
                    <div class="col-md-3 mb-3"><label class="form-label">Data Recebimento</label><input type="date" name="data_recebimento" class="form-control"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">Fornecedor *</label><input type="text" name="fornecedor" class="form-control" required></div>
                    <div class="col-md-3 mb-3"><label class="form-label">CNPJ</label><input type="text" name="cnpj_fornecedor" class="form-control"></div>
                    <div class="col-md-3 mb-3"><label class="form-label">Valor Total</label><input type="number" step="0.01" name="valor_total" class="form-control"></div>
                </div>
                <div class="mb-3"><label class="form-label">PDF da Nota</label><input type="file" name="arquivo_pdf" class="form-control" accept=".pdf"></div>
                <div class="mb-3"><label class="form-label">Observações</label><textarea name="observacoes" class="form-control" rows="2"></textarea></div>
                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Cadastrar</button>
                <a href="{{ url_for('notas_fiscais.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
