{% extends "base.html" %}

{% block titulo %}Novo Talhão{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/talhoes" class="btn btn-outline-secondary">← Voltar</a>
</div>

<div class="card">
    <div class="card-header bg-success text-white">
        <h3>➕ Cadastrar Novo Talhão</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="/talhao/novo">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nome" class="form-label">Nome do Talhão *</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                    <div class="form-text">Ex: Talhão 06 - Morro Alto</div>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="area" class="form-label">Área (hectares) *</label>
                    <input type="number" step="0.01" class="form-control" id="area" name="area" required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="data_plantio" class="form-label">Data de Plantio</label>
                    <input type="date" class="form-control" id="data_plantio" name="data_plantio">
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="variedade" class="form-label">Variedade do Café</label>
                    <input type="text" class="form-control" id="variedade" name="variedade" 
                           placeholder="Ex: Catuaí, Mundo Novo, Bourbon">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="altitude" class="form-label">Altitude Média (metros)</label>
                    <input type="number" step="1" class="form-control" id="altitude" name="altitude">
                </div>
            </div>
            
            <div class="mb-3">
                <label for="observacoes" class="form-label">Observações</label>
                <textarea class="form-control" id="observacoes" name="observacoes" rows="3"></textarea>
            </div>
            
            <button type="submit" class="btn btn-success">Salvar Talhão</button>
            <a href="/talhoes" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
