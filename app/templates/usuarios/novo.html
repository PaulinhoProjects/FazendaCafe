{% extends "base.html" %}

{% block titulo %}Novo Usuário{% endblock %}

{% block conteudo %}
<div class="page-header">
    <div>
        <h1 class="page-title"><i class="bi bi-person-plus me-2"></i>Novo Usuário</h1>
        <p class="page-subtitle">Crie um acesso e defina o nível de permissão</p>
    </div>
    <a href="/usuarios" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
</div>

<div class="card">
    <div class="card-header">
        <h6 class="mb-0">Dados do usuário</h6>
    </div>
    <div class="card-body">
        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo *</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            
            <div class="mb-3">
                <label for="login" class="form-label">Login *</label>
                <input type="text" class="form-control" id="login" name="login" required>
                <div class="form-text">Nome de usuário para acesso ao sistema</div>
            </div>
            
            <div class="mb-3">
                <label for="senha" class="form-label">Senha *</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            
            <div class="mb-3">
                <label for="nivel" class="form-label">Nível de Acesso *</label>
                <select class="form-select" id="nivel" name="nivel" required>
                    <option value="usuario">Usuário Comum (pode registrar, não pode editar/excluir)</option>
                    <option value="admin">Administrador (acesso total)</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success">Criar Usuário</button>
        </form>
    </div>
</div>
{% endblock %}
