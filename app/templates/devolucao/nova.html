{% extends "base.html" %}
{% block titulo %}Nova Devolução{% endblock %}
{% block conteudo %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle me-2"></i>Nova Devolução de Embalagens</h2>
        <a href="{{ url_for('devolucao.dashboard') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('devolucao.nova') }}" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-4 mb-3"><label class="form-label">Data *</label><input type="date" name="data_devolucao" class="form-control" required></div>
                    <div class="col-md-4 mb-3"><label class="form-label">Local de Devolução *</label><input type="text" name="local_devolucao" class="form-control" placeholder="Posto de coleta..." required></div>
                    <div class="col-md-4 mb-3"><label class="form-label">Quantidade de Embalagens *</label><input type="number" name="quantidade_embalagens" class="form-control" required></div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label class="form-label">Responsável</label><input type="text" name="nome_responsavel" class="form-control"></div>
                    <div class="col-md-4 mb-3"><label class="form-label">Nº Comprovante</label><input type="text" name="numero_comprovante" class="form-control"></div>
                    <div class="col-md-4 mb-3"><label class="form-label">PDF do Comprovante</label><input type="file" name="arquivo_pdf" class="form-control" accept=".pdf"></div>
                </div>
                <div class="mb-3"><label class="form-label">Observações</label><textarea name="observacoes" class="form-control" rows="2"></textarea></div>
                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Registrar</button>
                <a href="{{ url_for('devolucao.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
