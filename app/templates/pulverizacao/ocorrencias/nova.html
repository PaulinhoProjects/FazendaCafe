{% extends "base.html" %}
{% block titulo %}Nova Ocorrência de Praga{% endblock %}
{% block conteudo %}
<div class="container-fluid">
    <div class="page-header">
        <h1 class="page-title"><i class="bi bi-bug me-2"></i>Nova Ocorrência de Praga/Doença</h1>
        <a href="{{ url_for('pulverizacao.listar_aplicacoes') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('pulverizacao.nova_ocorrencia') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Talhão *</label>
                        <select name="talhao_id" class="form-select" required>
                            <option value="">Selecione...</option>
                            {% for t in talhoes %}
                            <option value="{{ t.id }}">{{ t.nome }} ({{ t.area }} ha)</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Praga/Doença *</label>
                        <select name="praga_id" class="form-select" required>
                            <option value="">Selecione...</option>
                            {% for p in pragas %}
                            <option value="{{ p.id }}">{{ p.nome }} ({{ p.tipo }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Data de Detecção *</label>
                        <input type="date" name="data_deteccao" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nível de Infestação</label>
                        <select name="nivel" class="form-select">
                            <option value="Baixo">Baixo</option>
                            <option value="Médio">Médio</option>
                            <option value="Alto">Alto</option>
                            <option value="Crítico">Crítico</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="tratado" id="tratado">
                            <label class="form-check-label" for="tratado">Foi tratado nesta aplicação</label>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Aplicação Relacionada (opcional)</label>
                    <input type="text" name="aplicacao_id" class="form-control" placeholder="ID da aplicação se houver">
                </div>
                <div class="mb-3">
                    <label class="form-label">Observações</label>
                    <textarea name="observacoes" class="form-control" rows="3" placeholder="Descreva os sintomas, localização na planta, etc."></textarea>
                </div>
                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Registrar Ocorrência</button>
                <a href="{{ url_for('pulverizacao.listar_aplicacoes') }}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
