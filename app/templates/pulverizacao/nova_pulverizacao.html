{% extends "base.html" %}

{% block titulo %}Nova Pulverização{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/pulverizacao" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-success text-white py-3">
        <h3 class="mb-0"><i class="bi bi-droplet-half me-2"></i>Registrar Nova Pulverização</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="/pulverizacao/nova">
            <!-- Linha 1: Talhão e Data -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="talhao_id" class="form-label fw-semibold">
                        <i class="bi bi-pin-map-fill text-success me-1"></i>Talhão <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="talhao_id" name="talhao_id" required>
                        <option value="">Selecione um talhão</option>
                        {% for t in talhoes %}
                        <option value="{{ t.id }}">{{ t.nome }} ({{ "%.2f"|format(t.area) }} ha)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="data_aplicacao" class="form-label fw-semibold">
                        <i class="bi bi-calendar-check text-success me-1"></i>Data da Aplicação <span class="text-danger">*</span>
                    </label>
                    <input type="date" class="form-control" id="data_aplicacao" name="data_aplicacao" 
                           value="{{ data_atual }}" required>
                </div>
            </div>

            <!-- Linha 2: Período e Receita -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="periodo_id" class="form-label fw-semibold">
                        <i class="bi bi-calendar-range text-warning me-1"></i>Período da Lavoura <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="periodo_id" name="periodo_id" required>
                        <option value="">Selecione o período</option>
                        {% for p in periodos %}
                        <option value="{{ p.id }}">{{ p.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="receita_id" class="form-label fw-semibold">
                        <i class="bi bi-file-earmark-text text-info me-1"></i>Receita Utilizada
                    </label>
                    <select class="form-select" id="receita_id" name="receita_id">
                        <option value="">Selecione uma receita (opcional)</option>
                        {% for r in receitas %}
                        <option value="{{ r.id }}">{{ r.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
<div class="row g-3 mb-3">
    <div class="col-md-6">
        <label for="tipo_aplicacao" class="form-label fw-semibold">
            <i class="bi bi-droplet text-primary me-1"></i>Tipo de Aplicação <span class="text-danger">*</span>
        </label>
        <select class="form-select" id="tipo_aplicacao" name="tipo_aplicacao" required>
            <option value="Foliar" selected>Foliar</option>
            <option value="Solo">Solo</option>
        </select>
    </div>
</div>
            <!-- Linha 3: Responsável e Retorno -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="responsavel" class="form-label fw-semibold">
                        <i class="bi bi-person-badge text-primary me-1"></i>Responsável
                    </label>
                    <input type="text" class="form-control" id="responsavel" name="responsavel" 
                           placeholder="Nome do operador/técnico">
                </div>
                <div class="col-md-6">
                    <label for="data_retorno" class="form-label fw-semibold">
                        <i class="bi bi-calendar2-week text-warning me-1"></i>Data Prevista para Retorno
                    </label>
                    <input type="date" class="form-control" id="data_retorno" name="data_retorno">
                    <div class="form-text text-muted">
                        <i class="bi bi-info-circle me-1"></i>Quando o agrônomo deve voltar para avaliar
                    </div>
                </div>
            </div>

            <!-- Condições Climáticas -->
            <div class="mb-4">
                <label for="condicoes" class="form-label fw-semibold">
                    <i class="bi bi-cloud-sun text-info me-1"></i>Condições Climáticas
                </label>
                <input type="text" class="form-control" id="condicoes" name="condicoes" 
                       placeholder="Ex: Tempo seco, 25°C, vento moderado">
            </div>

<!-- Pragas/Doenças Detectadas -->
<div class="mb-4">
    <label class="form-label fw-semibold">
        <i class="bi bi-bug text-danger me-1"></i> Pragas/Doenças Detectadas
    </label>
    <div class="row g-3">
        {% for p in pragas %}
        <div class="col-md-4">
            <div class="card h-100 border-0 shadow-sm" style="background-color: #f8f9fa;">
                <div class="card-body">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" 
                               name="pragas_detectadas" value="{{ p.id }}" 
                               id="praga_{{ p.id }}" 
                               style="width: 1.2em; height: 1.2em; margin-right: 8px;">
                        <label class="form-check-label fw-semibold" for="praga_{{ p.id }}">
                            {% if p.tipo == 'praga' %}
                                <i class="bi bi-bug-fill text-danger me-1"></i>
                            {% else %}
                                <i class="bi bi-virus2 text-warning me-1"></i> <!-- ícone diferente para doença -->
                            {% endif %}
                            {{ p.nome }}
                            <span class="badge {% if p.tipo == 'praga' %}bg-danger{% else %}bg-warning{% endif %} text-dark ms-1">
                                {% if p.tipo == 'praga' %}Praga{% else %}Doença{% endif %}
                            </span>
                        </label>
                    </div>
                    <select class="form-select form-select-sm mt-2" 
                            name="nivel_{{ p.id }}" id="nivel_{{ p.id }}" 
                            style="display:none;">
                        <option value="baixo">Baixo</option>
                        <option value="medio" selected>Médio</option>
                        <option value="alto">Alto</option>
                        <option value="critico">Crítico</option>
                    </select>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <small class="text-muted d-block mt-2">
        <i class="bi bi-info-circle me-1"></i> Selecione as pragas detectadas e defina o nível de infestação.
    </small>
</div>

            <!-- Observações -->
            <div class="mb-4">
                <label for="observacoes" class="form-label fw-semibold">
                    <i class="bi bi-chat-text text-secondary me-1"></i>Observações
                </label>
                <textarea class="form-control" id="observacoes" name="observacoes" rows="3" 
                          placeholder="Informações adicionais sobre a aplicação"></textarea>
            </div>

            <!-- Botões -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-check-circle me-1"></i>Registrar Pulverização
                </button>
                <a href="/pulverizacao" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script>
// Mostrar/esconder campo de nível quando a praga é selecionada
document.querySelectorAll('input[name="pragas_detectadas"]').forEach(checkbox => {
    checkbox.addEventListener('change', function() {
        const nivelSelect = document.getElementById('nivel_' + this.value);
        if (this.checked) {
            nivelSelect.style.display = 'block';
        } else {
            nivelSelect.style.display = 'none';
        }
    });
});
</script>
{% endblock %}
