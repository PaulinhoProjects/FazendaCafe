{% extends "base.html" %}

{% block titulo %}Editar Receita{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/pulverizacao/receitas" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-warning text-white py-3">
        <h3 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Receita</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <!-- Nome da Receita -->
            <div class="mb-3">
                <label for="nome" class="form-label fw-semibold">
                    <i class="bi bi-card-text text-primary me-1"></i>Nome da Receita <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="nome" name="nome" value="{{ receita.nome }}" required>
            </div>

            <!-- Período -->
            <div class="mb-3">
                <label for="periodo_id" class="form-label fw-semibold">
                    <i class="bi bi-calendar-range text-warning me-1"></i>Período <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="periodo_id" name="periodo_id" required>
                    {% for p in periodos %}
                    <option value="{{ p.id }}" {% if p.id == receita.periodo_id %}selected{% endif %}>{{ p.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Descrição -->
            <div class="mb-3">
                <label for="descricao" class="form-label fw-semibold">
                    <i class="bi bi-chat-text text-secondary me-1"></i>Descrição
                </label>
                <textarea class="form-control" id="descricao" name="descricao" rows="2">{{ receita.descricao or '' }}</textarea>
            </div>

            <!-- Fórmula -->
            <div class="mb-3">
                <label for="formula" class="form-label fw-semibold">
                    <i class="bi bi-file-text text-info me-1"></i>Fórmula <span class="text-danger">*</span>
                </label>
                <textarea class="form-control" id="formula" name="formula" rows="4" required>{{ receita.formula or '' }}</textarea>
                <div class="form-text text-muted">
                    <i class="bi bi-info-circle me-1"></i>Descreva a receita com produtos e dosagens.
                </div>
            </div>

            <!-- Produtos -->
            <div class="mb-3">
                <label for="produtos" class="form-label fw-semibold">
                    <i class="bi bi-box-seam text-success me-1"></i>Produtos
                </label>
                <input type="text" class="form-control" id="produtos" name="produtos" value="{{ receita.produtos or '' }}" placeholder="Ex: Produto A, Produto B, Adjuvante">
                <div class="form-text text-muted">
                    <i class="bi bi-info-circle me-1"></i>Lista separada por vírgulas.
                </div>
            </div>

            <!-- Observações -->
            <div class="mb-3">
                <label for="observacoes" class="form-label fw-semibold">
                    <i class="bi bi-chat-dots text-secondary me-1"></i>Observações
                </label>
                <textarea class="form-control" id="observacoes" name="observacoes" rows="2">{{ receita.observacoes or '' }}</textarea>
            </div>

            <!-- Botões -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning px-4">
                    <i class="bi bi-save me-1"></i>Salvar Alterações
                </button>
                <a href="/pulverizacao/receitas" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
