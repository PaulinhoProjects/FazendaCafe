{% extends "base.html" %}
{% block titulo %}Editar Receita{% endblock %}
{% block conteudo %}
<div class="container-fluid">
    <div class="page-header">
        <h1 class="page-title"><i class="bi bi-pencil-square me-2"></i>Editar Receita</h1>
        <a href="{{ url_for('pulverizacao.listar_receitas') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('pulverizacao.editar_receita', id=receita.id) }}">
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Nome da Receita *</label>
                        <input type="text" name="nome" class="form-control" value="{{ receita.nome }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Período</label>
                        <select name="periodo_id" class="form-select">
                            <option value="">Geral</option>
                            {% for p in periodos %}
                            <option value="{{ p.id }}" {% if p.id == receita.periodo_id %}selected{% endif %}>{{ p.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <input type="text" name="descricao" class="form-control" value="{{ receita.descricao or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Fórmula Completa</label>
                    <textarea name="formula" class="form-control" rows="4">{{ receita.formula or '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Produtos Utilizados</label>
                    <textarea name="produtos" class="form-control" rows="3">{{ receita.produtos or '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Observações</label>
                    <textarea name="observacoes" class="form-control" rows="2">{{ receita.observacoes or '' }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Salvar</button>
                <a href="{{ url_for('pulverizacao.listar_receitas') }}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
