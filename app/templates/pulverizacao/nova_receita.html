{% extends "base.html" %}

{% block titulo %}Nova Receita{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/pulverizacao/receitas" class="btn btn-outline-secondary">← Voltar</a>
</div>

<div class="card">
    <div class="card-header bg-success text-white">
        <h3>➕ Cadastrar Nova Receita</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="/pulverizacao/receita/nova">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="nome" class="form-label">Nome da Receita *</label>
                    <input type="text" class="form-control" id="nome" name="nome" required
                           placeholder="Ex: Receita A - Alta Produção">
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="periodo_id" class="form-label">Período *</label>
                    <select class="form-select" id="periodo_id" name="periodo_id" required>
                        <option value="">Selecione</option>
                        {% for p in periodos %}
                        <option value="{{ p.id }}">{{ p.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" name="descricao" rows="2"
                          placeholder="Breve descrição da receita"></textarea>
            </div>
            
            <div class="mb-3">
                <label for="formula" class="form-label">Fórmula Completa *</label>
                <textarea class="form-control" id="formula" name="formula" rows="4" required
                          placeholder="Ex: 200g de Produto X + 100ml de Produto Y por hectare"></textarea>
                <div class="form-text">Descreva a fórmula com detalhes (produtos, dosagens, modo de preparo)</div>
            </div>
            
            <div class="mb-3">
                <label for="produtos" class="form-label">Produtos Utilizados</label>
                <input type="text" class="form-control" id="produtos" name="produtos"
                       placeholder="Ex: Produto X, Produto Y, Adjuvante Z">
                <div class="form-text">Lista separada por vírgulas</div>
            </div>
            
            <div class="mb-3">
                <label for="observacoes" class="form-label">Observações</label>
                <textarea class="form-control" id="observacoes" name="observacoes" rows="2"
                          placeholder="Informações adicionais"></textarea>
            </div>
            
            <button type="submit" class="btn btn-success">Salvar Receita</button>
            <a href="/pulverizacao/receitas" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
