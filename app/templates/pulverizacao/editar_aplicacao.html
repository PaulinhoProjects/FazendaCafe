{% extends "base.html" %}

{% block titulo %}Editar Aplicação{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/pulverizacao/aplicacao/{{ aplicacao.id }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-warning text-white py-3">
        <h3 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Aplicação</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <!-- Linha 1: Talhão e Data -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="talhao_id" class="form-label fw-semibold">
                        <i class="bi bi-pin-map-fill text-success me-1"></i>Talhão <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="talhao_id" name="talhao_id" required>
                        {% for t in talhoes %}
                        <option value="{{ t.id }}" {% if t.id == aplicacao.talhao_id %}selected{% endif %}>
                            {{ t.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="data_aplicacao" class="form-label fw-semibold">
                        <i class="bi bi-calendar-check text-success me-1"></i>Data da Aplicação <span class="text-danger">*</span>
                    </label>
                    <input type="date" class="form-control" id="data_aplicacao" name="data_aplicacao" 
                           value="{{ aplicacao.data_aplicacao }}" required>
                </div>
            </div>

            <!-- Linha 2: Período e Receita -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="periodo_id" class="form-label fw-semibold">
                        <i class="bi bi-calendar-range text-warning me-1"></i>Período <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="periodo_id" name="periodo_id" required>
                        {% for p in periodos %}
                        <option value="{{ p.id }}" {% if p.id == aplicacao.periodo_id %}selected{% endif %}>
                            {{ p.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="receita_id" class="form-label fw-semibold">
                        <i class="bi bi-file-earmark-text text-info me-1"></i>Receita
                    </label>
                    <select class="form-select" id="receita_id" name="receita_id">
                        <option value="">Nenhuma</option>
                        {% for r in receitas %}
                        <option value="{{ r.id }}" {% if r.id == aplicacao.receita_id %}selected{% endif %}>
                            {{ r.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Linha 2.5: Tipo de Aplicação -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="tipo_aplicacao" class="form-label fw-semibold">
                        <i class="bi bi-droplet-half text-primary me-1"></i>Tipo de Aplicação
                    </label>
                    <select class="form-select" id="tipo_aplicacao" name="tipo_aplicacao">
                        <option value="foliar" {% if aplicacao.tipo_aplicacao == 'foliar' %}selected{% endif %}>
                            <i class="bi bi-droplet me-1"></i>Foliar
                        </option>
                        <option value="solo" {% if aplicacao.tipo_aplicacao == 'solo' %}selected{% endif %}>
                            <i class="bi bi-tree me-1"></i>Solo
                        </option>
                    </select>
                </div>
            </div>

            <!-- Linha 3: Responsável e Retorno Previsto -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="responsavel" class="form-label fw-semibold">
                        <i class="bi bi-person-badge text-primary me-1"></i>Responsável
                    </label>
                    <input type="text" class="form-control" id="responsavel" name="responsavel" 
                           value="{{ aplicacao.responsavel or '' }}" placeholder="Nome do responsável">
                </div>
                <div class="col-md-6">
                    <label for="data_prevista_retorno" class="form-label fw-semibold">
                        <i class="bi bi-calendar2-week text-warning me-1"></i>Data de Retorno Prevista
                    </label>
                    <input type="date" class="form-control" id="data_prevista_retorno" name="data_prevista_retorno" 
                           value="{{ aplicacao.data_prevista_retorno or '' }}">
                </div>
            </div>

            <!-- Condições Climáticas -->
            <div class="mb-3">
                <label for="condicoes" class="form-label fw-semibold">
                    <i class="bi bi-cloud-sun text-info me-1"></i>Condições Climáticas
                </label>
                <input type="text" class="form-control" id="condicoes" name="condicoes" 
                       value="{{ aplicacao.condicoes or '' }}" placeholder="Ex: Tempo seco, 25°C, vento moderado">
            </div>

            <!-- Observações -->
            <div class="mb-3">
                <label for="observacoes" class="form-label fw-semibold">
                    <i class="bi bi-chat-text text-secondary me-1"></i>Observações
                </label>
                <textarea class="form-control" id="observacoes" name="observacoes" rows="3">{{ aplicacao.observacoes or '' }}</textarea>
            </div>

            <!-- Botões -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning px-4">
                    <i class="bi bi-save me-1"></i>Salvar Alterações
                </button>
                <a href="/pulverizacao/aplicacao/{{ aplicacao.id }}" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
