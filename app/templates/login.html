<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazenda Cafe - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #2c5f2d 0%, #1a3d1a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 400px; width: 100%; padding: 2rem; }
        .login-icon { width: 70px; height: 70px; background: #2c5f2d; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
        .login-icon i { font-size: 2rem; color: white; }
        .btn-login { background: #2c5f2d; color: white; width: 100%; padding: 0.7rem; border: none; border-radius: 6px; font-weight: 600; }
        .btn-login:hover { background: #1a3d1a; color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon"><i class="bi bi-cup-hot-fill"></i></div>
        <h3 class="text-center mb-1">Fazenda Cafe</h3>
        <p class="text-center text-muted mb-4">Sistema de Gestao Agricola</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" name="usuario" required autofocus>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <button type="submit" class="btn btn-login"><i class="bi bi-box-arrow-in-right me-1"></i> Entrar</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Usuario padrao: admin / admin123</small>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
