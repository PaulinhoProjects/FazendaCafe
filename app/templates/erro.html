{% extends "base.html" %}
{% block titulo %}Erro {{ codigo }}{% endblock %}
{% block breadcrumb %}
{{ super() }}
<li class="breadcrumb-item active">Erro {{ codigo }}</li>
{% endblock %}
{% block conteudo %}
<div class="empty-state">
    <i class="bi bi-exclamation-octagon text-danger"></i>
    <h1 class="display-4 fw-bold">Erro {{ codigo }}</h1>
    <h3 class="mt-3">{{ titulo }}</h3>
    <p>{{ mensagem }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house-door me-1"></i>Voltar ao Dashboard
    </a>
</div>
{% endblock %}
