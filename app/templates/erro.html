{% extends "base.html" %}
{% block titulo %}Erro {{ codigo }}{% endblock %}
{% block breadcrumb %}
{{ super() }}
<li class="breadcrumb-item active">Erro {{ codigo }}</li>
{% endblock %}
{% block conteudo %}
<div class="erro-kaldi">
    <div class="erro-kaldi-caixa">
        <img class="erro-kaldi-icone" src="{{ url_for('static', filename='img/kaldi-icone.svg') }}" alt="Kaldi" width="72" height="72">
        <div class="erro-kaldi-codigo">{{ codigo }}</div>
        <h1>{{ titulo }}</h1>
        <p>{{ mensagem }}</p>
        <div class="erro-kaldi-acoes">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="bi bi-house-door me-1"></i>Ir para o início</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
        </div>
    </div>
</div>
{% endblock %}
