{% extends "base.html" %}

{% block titulo %}Nova Movimentação{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/estoque" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar ao Estoque
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white py-3">
        <h3 class="mb-0"><i class="bi bi-arrow-left-right me-2"></i>Registrar Movimentação</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="/estoque/movimentacao/nova">
            <input type="hidden" name="tipo" id="tipo_input" value="{{ tipo }}">

            <div class="mb-4">
                <label class="form-label fw-semibold">Tipo de Movimentação</label>
                <div class="d-flex gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipo_radio" id="tipo_entrada" 
                               value="entrada" {% if tipo == 'entrada' %}checked{% endif %}>
                        <label class="form-check-label text-success" for="tipo_entrada">
                            <i class="bi bi-box-arrow-in-down me-1"></i> Entrada
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipo_radio" id="tipo_saida" 
                               value="saida" {% if tipo == 'saida' %}checked{% endif %}>
                        <label class="form-check-label text-danger" for="tipo_saida">
                            <i class="bi bi-box-arrow-up me-1"></i> Saída
                        </label>
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Produto</label>
                    <select class="form-select" name="produto_id" id="produto_select" required>
                        <option value="">Selecione um produto</option>
                        {% for p in produtos %}
                        <option value="{{ p.id }}" 
                                data-saldo="{{ p.quantidade_atual }}" 
                                data-unidade="{{ p.unidade }}"
                                {% if produto_id and produto_id|int == p.id %}selected{% endif %}>
                            {{ p.nome }} - Saldo: {{ p.quantidade_atual|format_quantidade }} {{ p.unidade }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Data</label>
                    <input type="date" class="form-control" name="data_movimento" value="{{ data_atual }}" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Quantidade</label>
                    <input type="number" step="0.01" class="form-control" name="quantidade" id="quantidade" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Unidade</label>
                    <input type="text" class="form-control" name="unidade" placeholder="Ex: litro, kg">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Valor Unitário (R$)</label>
                    <input type="number" step="0.01" class="form-control" name="valor_unitario">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Observações</label>
                <textarea class="form-control" name="observacoes" rows="2"></textarea>
            </div>

            <!-- Alerta de estoque (visível apenas para saída) -->
            <div class="alert alert-warning d-none" id="alerta_estoque">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span id="alerta_mensagem"></span>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i> Registrar
                </button>
                <a href="/estoque" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tipoEntrada = document.getElementById('tipo_entrada');
    const tipoSaida = document.getElementById('tipo_saida');
    const tipoInput = document.getElementById('tipo_input');
    const produtoSelect = document.getElementById('produto_select');
    const quantidadeInput = document.getElementById('quantidade');
    const alertaEstoque = document.getElementById('alerta_estoque');
    const alertaMensagem = document.getElementById('alerta_mensagem');

    // Atualiza o input hidden quando muda o tipo
    function atualizarTipo() {
        if (tipoEntrada.checked) {
            tipoInput.value = 'entrada';
        } else if (tipoSaida.checked) {
            tipoInput.value = 'saida';
        }
        verificarEstoque();
    }

    tipoEntrada.addEventListener('change', atualizarTipo);
    tipoSaida.addEventListener('change', atualizarTipo);

    function verificarEstoque() {
        // Só verifica se for saída
        if (!tipoSaida.checked) {
            alertaEstoque.classList.add('d-none');
            return;
        }

        const option = produtoSelect.selectedOptions[0];
        if (!option || !option.value) {
            alertaEstoque.classList.add('d-none');
            return;
        }

        const saldo = parseFloat(option.dataset.saldo) || 0;
        const unidade = option.dataset.unidade || '';
        const qtd = parseFloat(quantidadeInput.value) || 0;

        if (qtd > saldo) {
            alertaEstoque.classList.remove('d-none');
            alertaMensagem.textContent = `Estoque insuficiente! Saldo atual: ${saldo} ${unidade}`;
        } else {
            alertaEstoque.classList.add('d-none');
        }
    }

    produtoSelect.addEventListener('change', verificarEstoque);
    quantidadeInput.addEventListener('input', verificarEstoque);
});
</script>
{% endblock %}
