{% extends "base.html" %}

{% block titulo %}Editar Movimentação{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/estoque/produto/{{ mov.produto_id }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar ao Produto
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-warning text-white py-3">
        <h3 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Movimentação</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Produto</label>
                    <select class="form-select" name="produto_id" required>
                        {% for p in produtos %}
                        <option value="{{ p.id }}" {% if p.id == mov.produto_id %}selected{% endif %}>
                            {{ p.nome }} (Saldo: {{ p.quantidade_atual }} {{ p.unidade }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Tipo</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipo" id="tipoEntrada" value="entrada" {% if mov.tipo == 'entrada' %}checked{% endif %} required>
                            <label class="form-check-label text-success" for="tipoEntrada">
                                <i class="bi bi-box-arrow-in-down"></i> Entrada
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipo" id="tipoSaida" value="saida" {% if mov.tipo == 'saida' %}checked{% endif %} required>
                            <label class="form-check-label text-danger" for="tipoSaida">
                                <i class="bi bi-box-arrow-up"></i> Saída
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Quantidade</label>
                    <input type="number" step="0.01" class="form-control" name="quantidade" value="{{ mov.quantidade }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Unidade</label>
                    <input type="text" class="form-control" name="unidade" value="{{ mov.unidade or '' }}" placeholder="Ex: litro, kg">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Data</label>
                    <input type="date" class="form-control" name="data_movimento" value="{{ mov.data_movimento }}" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Valor Unitário (R$)</label>
                    <input type="number" step="0.01" class="form-control" name="valor_unitario" value="{{ mov.valor_unitario or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Observações</label>
                    <input type="text" class="form-control" name="observacoes" value="{{ mov.observacoes or '' }}">
                </div>
            </div>

            <div class="alert alert-warning">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <strong>Atenção:</strong> Ao editar esta movimentação, o saldo do produto será recalculado automaticamente.
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning px-4">
                    <i class="bi bi-save me-1"></i>Salvar Alterações
                </button>
                <a href="/estoque/produto/{{ mov.produto_id }}" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
