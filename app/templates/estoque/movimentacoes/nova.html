{% extends "base.html" %}

{% block titulo %}Nova Movimentação{% endblock %}

{% block conteudo %}
<div class="container-fluid">
    <div class="page-header">
        <h1 class="page-title"><i class="bi bi-plus-circle me-2"></i>Nova Movimentação</h1>
        <a href="{{ url_for('estoque.listar_movimentacoes') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
    </div>


    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('estoque.nova_movimentacao') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Produto *</label>
                        <select name="produto_id" class="form-select" required>
                            <option value="">Selecione...</option>
                            {% for p in produtos %}
                            <option value="{{ p.id }}">{{ p.nome }} ({{ p.unidade }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Tipo *</label>
                        <select name="tipo" class="form-select" required>
                            <option value="entrada">Entrada</option>
                            <option value="saida">Saída</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Data *</label>
                        <input type="date" name="data_movimento" class="form-control" value="{{ hoje }}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Quantidade *</label>
                        <input type="number" step="0.01" name="quantidade" class="form-control" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Unidade</label>
                        <input type="text" name="unidade" class="form-control" placeholder="kg, L, un...">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Valor Unitário</label>
                        <input type="number" step="0.01" name="valor_unitario" class="form-control" placeholder="0.00">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Observações</label>
                    <textarea name="observacoes" class="form-control" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Registrar</button>
                <a href="{{ url_for('estoque.listar_movimentacoes') }}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
