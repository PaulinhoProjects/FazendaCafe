{% extends "base.html" %}

{% block titulo %}Novo Produto{% endblock %}

{% block breadcrumb %}
{{ super() }}
<li class="breadcrumb-item"><a href="{{ url_for('estoque.dashboard') }}">Estoque</a></li>
<li class="breadcrumb-item"><a href="{{ url_for('estoque.listar_produtos') }}">Produtos</a></li>
<li class="breadcrumb-item active">Novo</li>
{% endblock %}

{% block conteudo %}
<div class="container-fluid">
    <div class="page-header mb-4">
    <div>
        <h1 class="page-title"><i class="bi bi-box-seam me-2"></i>Novo Produto</h1>
        <p class="page-subtitle">Cadastre um novo insumo no estoque</p>
    </div>
    <a href="{{ url_for('estoque.listar_produtos') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('estoque.novo_produto') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nome do Produto <span class="text-danger">*</span></label>
                        <input type="text" name="nome" class="form-control" required placeholder="Ex: Fungicida X">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Categoria</label>
                        <select name="categoria" class="form-select">
                            <option value="">Selecione...</option>
                            <option value="Fungicida">Fungicida</option>
                            <option value="Inseticida">Inseticida</option>
                            <option value="Herbicida">Herbicida</option>
                            <option value="Fertilizante">Fertilizante</option>
                            <option value="Adjuvante">Adjuvante</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Unidade <span class="text-danger">*</span></label>
                        <select name="unidade" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option value="L">Litro (L)</option>
                            <option value="kg">Quilo (kg)</option>
                            <option value="sc">Saca (sc)</option>
                            <option value="un">Unidade (un)</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Estoque Mínimo</label>
                        <input type="number" name="estoque_minimo" class="form-control" step="0.01" min="0" value="0">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Quantidade Atual</label>
                        <input type="number" name="quantidade_atual" class="form-control" step="0.01" min="0" value="0">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Observações</label>
                        <textarea name="observacoes" class="form-control" rows="3"
                            placeholder="Observações sobre o produto..."></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Cadastrar Produto
                    </button>
                    <a href="{{ url_for('estoque.listar_produtos') }}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
