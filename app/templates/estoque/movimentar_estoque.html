{% extends "base.html" %}

{% block titulo %}Movimentar Estoque{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/estoque" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-info text-white py-3">
        <h3 class="mb-0"><i class="bi bi-arrow-left-right me-2"></i>Movimentar Estoque</h3>
    </div>
    <div class="card-body p-4">
        <div class="alert alert-info">
            <strong>Produto:</strong> {{ produto.nome }}<br>
            <strong>Saldo atual:</strong> {{ produto.saldo_atual }} {{ produto.unidade }}
        </div>

        <form method="POST" action="/estoque/produto/{{ produto.id }}/movimentar">
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label for="tipo" class="form-label fw-semibold">Tipo</label>
                    <select class="form-select" id="tipo" name="tipo" required>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="quantidade" class="form-label fw-semibold">Quantidade <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" class="form-control" id="quantidade" name="quantidade" required>
                </div>
                <div class="col-md-4">
                    <label for="data" class="form-label fw-semibold">Data</label>
                    <input type="date" class="form-control" id="data" name="data" value="{{ data_atual }}">
                </div>
            </div>

            <div class="mb-3">
                <label for="observacao" class="form-label fw-semibold">Observação</label>
                <textarea class="form-control" id="observacao" name="observacao" rows="2" placeholder="Ex: Nota fiscal, motivo, etc."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-info px-4 text-white">
                    <i class="bi bi-check-circle me-1"></i>Registrar Movimentação
                </button>
                <a href="/estoque" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
