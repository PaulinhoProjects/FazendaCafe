{% extends "base.html" %}
{% block titulo %}Novo Laboratório{% endblock %}
{% block conteudo %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle me-2"></i>Novo Laboratório</h2>
        <a href="{{ url_for('analises.listar_laboratorios') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('analises.novo_laboratorio') }}">
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">Nome *</label><input type="text" name="nome" class="form-control" required></div>
                    <div class="col-md-6 mb-3"><label class="form-label">Responsável</label><input type="text" name="responsavel" class="form-control"></div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label class="form-label">Telefone</label><input type="text" name="telefone" class="form-control"></div>
                    <div class="col-md-4 mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
                    <div class="col-md-4 mb-3"><label class="form-label">Endereço</label><input type="text" name="endereco" class="form-control"></div>
                </div>
                <div class="mb-3"><label class="form-label">Observações</label><textarea name="observacoes" class="form-control" rows="2"></textarea></div>
                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Cadastrar</button>
                <a href="{{ url_for('analises.listar_laboratorios') }}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
