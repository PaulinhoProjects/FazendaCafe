{% extends "base.html" %}

{% block titulo %}Novo Laboratório{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/analises/laboratorios" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-success text-white py-3">
        <h3 class="mb-0"><i class="bi bi-building me-2"></i>Cadastrar Laboratório</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nome do Laboratório <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="nome" required placeholder="Ex: Laboratório ABC">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Responsável</label>
                    <input type="text" class="form-control" name="responsavel" placeholder="Nome do contato">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Telefone</label>
                    <input type="text" class="form-control" name="telefone" placeholder="(99) 99999-9999">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" name="email" placeholder="contato@laboratorio.com">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Endereço</label>
                <textarea class="form-control" name="endereco" rows="2" placeholder="Endereço completo..."></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Observações</label>
                <textarea class="form-control" name="observacoes" rows="2" placeholder="Informações adicionais..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-save me-1"></i>Salvar
                </button>
                <a href="/analises/laboratorios" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
