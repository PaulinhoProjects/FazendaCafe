{% extends "base.html" %}
{% block titulo %}Editar Laboratório{% endblock %}
{% block conteudo %}
<div class="container-fluid">
    <div class="page-header">
        <h1 class="page-title"><i class="bi bi-building me-2"></i>Editar Laboratório</h1>
        <a href="{{ url_for('analises.listar_laboratorios') }}" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('analises.editar_laboratorio', id=laboratorio.id) }}">
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">Nome *</label><input type="text" name="nome" class="form-control" value="{{ laboratorio.nome }}" required></div>
                    <div class="col-md-6 mb-3"><label class="form-label">Responsável</label><input type="text" name="responsavel" class="form-control" value="{{ laboratorio.responsavel or '' }}"></div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3"><label class="form-label">Telefone</label><input type="text" name="telefone" class="form-control" value="{{ laboratorio.telefone or '' }}"></div>
                    <div class="col-md-4 mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ laboratorio.email or '' }}"></div>
                    <div class="col-md-4 mb-3"><label class="form-label">Endereço</label><input type="text" name="endereco" class="form-control" value="{{ laboratorio.endereco or '' }}"></div>
                </div>
                <div class="mb-3"><label class="form-label">Observações</label><textarea name="observacoes" class="form-control" rows="2">{{ laboratorio.observacoes or '' }}</textarea></div>
                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Salvar</button>
                <a href="{{ url_for('analises.listar_laboratorios') }}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
