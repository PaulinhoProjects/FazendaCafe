{% extends "base.html" %}

{% block titulo %}Nova Análise{% endblock %}

{% block conteudo %}
<div class="mb-4">
    <a href="/analises" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Voltar
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-success text-white py-3">
        <h3 class="mb-0"><i class="bi bi-flask me-2"></i>Registrar Nova Análise</h3>
    </div>
    <div class="card-body p-4">
        <form method="POST" enctype="multipart/form-data">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-pin-map-fill text-success me-1"></i>Talhão <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" name="talhao_id" required>
                        <option value="">Selecione um talhão</option>
                        {% for t in talhoes %}
                        <option value="{{ t.id }}">{{ t.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-tag text-primary me-1"></i>Tipo de Análise <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" name="tipo_id" id="tipo_id" required>
                        <option value="">Selecione</option>
                        {% for t in tipos %}
                        <option value="{{ t.id }}" {% if request.args.get('tipo')|int == t.id %}selected{% endif %}>
                            {{ t.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-calendar-check text-success me-1"></i>Data da Coleta <span class="text-danger">*</span>
                    </label>
                    <input type="date" class="form-control" name="data_coleta" value="{{ data_atual }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-calendar2-week text-warning me-1"></i>Data do Resultado
                    </label>
                    <input type="date" class="form-control" name="data_resultado">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-building text-secondary me-1"></i>Laboratório
                    </label>
                    <select class="form-select" name="laboratorio_id">
                        <option value="">Selecione (opcional)</option>
                        {% for l in laboratorios %}
                        <option value="{{ l.id }}">{{ l.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-upc-scan text-info me-1"></i>Nº Protocolo
                    </label>
                    <input type="text" class="form-control" name="numero_protocolo" placeholder="Código do laboratório">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="bi bi-person-badge text-primary me-1"></i>Responsável pela Coleta
                </label>
                <input type="text" class="form-control" name="responsavel" placeholder="Nome de quem coletou">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="bi bi-chat-text text-secondary me-1"></i>Observações
                </label>
                <textarea class="form-control" name="observacoes" rows="3" placeholder="Observações sobre a coleta..."></textarea>
            </div>
<!-- Upload de PDF -->
<div class="mb-3">
    <label class="form-label fw-semibold">
        <i class="bi bi-file-pdf text-danger me-1"></i>Arquivo PDF da Análise
    </label>
    
    <div class="mb-2">
        <div class="form-check">
            <input class="form-check-input" type="radio" name="pdf_opcao" id="pdf_novo" value="novo" checked>
            <label class="form-check-label" for="pdf_novo">
                <i class="bi bi-upload me-1"></i>Fazer upload de um novo PDF
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="pdf_opcao" id="pdf_existente" value="existente">
            <label class="form-check-label" for="pdf_existente">
                <i class="bi bi-files me-1"></i>Usar PDF já existente
            </label>
        </div>
    </div>
    
    <div id="campo_upload">
        <input type="file" class="form-control" name="arquivo_pdf" accept=".pdf">
    </div>
    
    <div id="campo_selecao" style="display:none;">
        <select class="form-select" name="pdf_existente">
            <option value="">Selecione um PDF...</option>
            {% for pdf in pdfs_existentes %}
            <option value="{{ pdf }}">{{ pdf }}</option>
            {% endfor %}
        </select>
    </div>
    
    <small class="text-muted">Você pode fazer upload de um novo PDF ou usar um já existente</small>
</div>

<script>
document.querySelectorAll('input[name="pdf_opcao"]').forEach(radio => {
    radio.addEventListener('change', function() {
        if (this.value === 'novo') {
            document.getElementById('campo_upload').style.display = 'block';
            document.getElementById('campo_selecao').style.display = 'none';
        } else {
            document.getElementById('campo_upload').style.display = 'none';
            document.getElementById('campo_selecao').style.display = 'block';
        }
    });
});
</script>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success px-4">
                    <i class="bi bi-save me-1"></i>Salvar Análise
                </button>
                <a href="/analises" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

        }

</script>
{% endblock %}
