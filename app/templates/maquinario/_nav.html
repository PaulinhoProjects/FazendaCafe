{% set caminho = request.path %}
<ul class="nav nav-tabs mb-4" role="tablist">

           href="{{ url_for('maquinario.dashboard') }}"><i class="bi bi-grid me-1"></i>Visão geral</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if '/maquinario/estoque' in caminho or '/maquinario/movimentacoes' in caminho %}active{% endif %}"
           href="{{ url_for('maquinario.estoque') }}"><i class="bi bi-box-seam me-1"></i>Estoque</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if '/maquinario/maquinas' in caminho or '/maquinario/manutencoes' in caminho %}active{% endif %}"
           href="{{ url_for('maquinario.maquinas') }}"><i class="bi bi-wrench me-1"></i>Maquinário</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if '/maquinario/combustivel' in caminho %}active{% endif %}"
           href="{{ url_for('maquinario.combustivel') }}"><i class="bi bi-fuel-pump me-1"></i>Combustível</a>

        <a class="nav-link {% if '/maquinario/gastos' in caminho %}active{% endif %}"
